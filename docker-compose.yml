services:
  postgres:
    image: postgres:16-alpine
    container_name: lists-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lists
    volumes:
      - lists_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lists"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lists_postgres_data:
